name: Generate stats cards
on:
  schedule:
    - cron: "0 3 * * *"   # diario a las 3 UTC
  workflow_dispatch:       # botón para ejecutarlo a mano

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: layout=compact&theme=radical&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          git diff --quiet --staged || git commit -m "Update stats cards"
          git push